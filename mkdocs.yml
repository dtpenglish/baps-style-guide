# BAPS DTP Style Guide — MkDocs Configuration
# Version: 1.0
# ---------------------------------------------------------------
# After editing this file, preview locally with:
#   mkdocs serve
# Push to main branch to auto-deploy via GitHub Actions.

site_name: BAPS SAP Style Guide
site_description: >-
  Editorial, design, and production conventions for BAPS Swaminarayan Aksharpith (SAP),
  the publishing house of BAPS Swaminarayan Sanstha — covering Sanskrit, Gujarati,
  Hindi, and English materials.
site_author: BAPS SAP Team
site_url: https://dtpenglish.github.io/baps-style-guide/

# ---------------------------------------------------------------
# Repository — enables the "Edit this page" pencil icon
# ---------------------------------------------------------------
repo_name: dtpenglish/baps-style-guide
repo_url: https://github.com/dtpenglish/baps-style-guide
edit_uri: edit/main/docs/

# ---------------------------------------------------------------
# Theme
# ---------------------------------------------------------------
theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.action.edit         # Pencil icon → opens GitHub web editor
    - content.action.view         # Eye icon → views raw source
    - content.code.copy
    - content.tabs.link
    - content.tooltips
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Noto Sans
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
    view: material/eye

# ---------------------------------------------------------------
# Plugins
# ---------------------------------------------------------------
plugins:
  - search:
      lang: en
  - git-revision-date-localized:
      enable_creation_date: true
      type: timeago
      fallback_to_build_date: true
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      width: 100%
      height: auto
      zoomable: true

# ---------------------------------------------------------------
# Markdown extensions
# ---------------------------------------------------------------
markdown_extensions:
  # Admonitions (note/warning/tip callouts)
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  # Tabs and rich content
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.caret
  - pymdownx.smartsymbols
  - pymdownx.tasklist:
      custom_checkbox: true
  # Standard
  - tables
  - footnotes
  - attr_list
  - md_in_html
  - def_list
  - abbr
  - toc:
      permalink: true
      permalink_title: Anchor link to this section
      toc_depth: 3

# ---------------------------------------------------------------
# Navigation — top-level structure
# ---------------------------------------------------------------
nav:
  - Home: index.md
  - Concepts: concepts/index.md
  - Translation:
      - "2 Translation & Transliteration": translation/index.md
      - "3 Translation Rules": translation/translation-rules.md
  - Editorial:
      - "4 Editorial": editorial/index.md
      - "5 Tone & Voice": editorial/tone-and-voice.md
      - "6 Capitalization": editorial/capitalization.md
      - "7 Doctrinal Titles & Reverential Cap": editorial/doctrinal-titles.md
      - "8 Italics": editorial/italics.md
      - "9 Plurals": editorial/plurals.md
      - "10 Numbers": editorial/numbers.md
      - "11 Quotation Marks": editorial/quotation-marks.md
      - "12 Punctuation": editorial/punctuation.md
  - Tithis: tithis/index.md
  - Diacritics:
      - "14 Diacritics & Transliteration": diacritics/index.md
      - "15 SAP Diacritics Policy": diacritics/sap-policy.md
      - "16 Macron-Only Convention": diacritics/macron-convention.md
      - "17 Glossary Reference": diacritics/glossary-reference.md
  - InDesign:
      - "18 InDesign": indesign/index.md
      - "19 Paragraph Styles": indesign/paragraph-styles.md
      - "20 Master Pages": indesign/master-pages.md
  - EPUB:
      - "21 EPUB Accessibility": epub/index.md
      - "22 Alt Text Guidelines": epub/alt-text.md
      - "23 Reading Order": epub/reading-order.md
  - Scripts:
      - "24 Scripts & Tools": scripts/index.md
      - "25 JSX Scripts Reference": scripts/jsx-reference.md
  - Workflows:
      - "26 Workflows": workflows/index.md
      - "27 File Versioning Rules": workflows/versioning.md
      - "28 File Naming": workflows/file-naming.md
  - Discussions:
      - "29 Open Discussions": discussions/index.md
      - "30 Sanstha & Mandirs": discussions/sanstha-and-mandirs.md
      - "31 Gurus & Honorifics": discussions/gurus-and-honorifics.md
      - "32 Shastras": discussions/shastras.md
      - "33 Indic Words": discussions/indic-words.md
      - "34 Transliteration": discussions/transliteration.md
      - "35 Web — BrE or AmE?": discussions/web.md
      - "36 Base Style Manual": discussions/base-style-manual.md
  - Contributing: contributing.md
  - Changelog: changelog.md

# ---------------------------------------------------------------
# Extra
# ---------------------------------------------------------------
extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/dtpenglish
  version:
    provider: mike
    default: latest

copyright: >
  Copyright © BAPS Swaminarayan Sanstha — DTP Team.
  Internal style guide for production use.
