# BAPS DTP Style Guide — MkDocs Configuration
# Version: 1.0
# ---------------------------------------------------------------
# After editing this file, preview locally with:
#   mkdocs serve
# Push to main branch to auto-deploy via GitHub Actions.

site_name: BAPS SAP Style Guide
site_description: >-
  Editorial, design, and production conventions for BAPS Swaminarayan Aksharpith (SAP),
  the publishing house of BAPS Swaminarayan Sanstha — covering Sanskrit, Gujarati,
  Hindi, and English materials.
site_author: BAPS SAP Team
site_url: https://dtpenglish.github.io/baps-style-guide/

# ---------------------------------------------------------------
# Repository — surfaces the "View source" eye icon and ties the site to the GitHub repo
# ---------------------------------------------------------------
repo_name: dtpenglish/baps-style-guide
repo_url: https://github.com/dtpenglish/baps-style-guide
edit_uri: edit/main/docs/

# ---------------------------------------------------------------
# Theme
# ---------------------------------------------------------------
theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - navigation.path
    - toc.follow
    - toc.integrate
    - search.suggest
    - search.highlight
    - search.share
    # - content.action.edit       # Pencil icon disabled — visitors are view-only.
    #                               Maintainer edits via GitHub directly,
    #                               github.dev (press . on any repo page),
    #                               local clone, or Claude Code.
    - content.action.view         # Eye icon → views raw source
    - content.code.copy
    - content.tabs.link
    - content.tooltips
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Noto Sans
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
    view: material/eye

# ---------------------------------------------------------------
# Plugins
# ---------------------------------------------------------------
plugins:
  - search:
      lang: en
  - git-revision-date-localized:
      enable_creation_date: true
      type: timeago
      fallback_to_build_date: true
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      width: 100%
      height: auto
      zoomable: true
  # Print-site plugin: generates one consolidated HTML page at
  # /print_page/ containing every site page in nav order. That page
  # is then printed to PDF by `build-pdf.py` (using Playwright /
  # Chromium). The plugin itself is always on; it's harmless on the
  # live site (one extra hidden page) and required for the PDF
  # workflow. To build the PDF:
  #   python build-pdf.py
  - print-site:
      add_to_navigation: false
      print_page_title: "BAPS SAP Style Guide — Print Edition"
      add_print_site_banner: false
      enumerate_headings: false
      enumerate_figures: false
      add_full_urls: false
      add_table_of_contents: true
      toc_title: "Contents"
      toc_depth: 2
      add_cover_page: true
      cover_page_template: "resources/cover.html.j2"

# ---------------------------------------------------------------
# Markdown extensions
# ---------------------------------------------------------------
markdown_extensions:
  # Admonitions (note/warning/tip callouts)
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  # Tabs and rich content
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  # Snippets auto-includes the abbreviations file on every page,
  # so jargon hover-tooltips work site-wide. Maintain abbreviations
  # in includes/abbreviations.md.
  - pymdownx.snippets:
      auto_append:
        - includes/abbreviations.md
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.caret
  - pymdownx.smartsymbols
  # Auto-convert straight quotes/apostrophes in source to typographers' (curly) quotes.
  # smart_dashes/ellipses disabled — we handle those via real Unicode characters.
  - smarty:
      smart_dashes: false
      smart_ellipses: false
  - pymdownx.tasklist:
      custom_checkbox: true
  # Standard
  - tables
  - footnotes
  - attr_list
  - md_in_html
  - def_list
  - abbr
  - toc:
      permalink: true
      permalink_title: Anchor link to this section
      toc_depth: 3

# ---------------------------------------------------------------
# Navigation — top-level structure
# ---------------------------------------------------------------
nav:
  - Home: index.md
  - Quick Find: quick-find.md
  - Concepts: concepts/index.md
  - Translation:
      - "2.1 Translation & Transliteration": translation/index.md
      - "2.2 Translation Rules": translation/translation-rules.md
  - Editorial:
      - "3.1 Editorial": editorial/index.md
      - "3.2 Tone & Voice": editorial/tone-and-voice.md
      - "3.3 Capitalization": editorial/capitalization.md
      - "3.4 Title Case in Detail": editorial/title-case.md
      - "3.5 Doctrinal Titles & Reverential Cap": editorial/doctrinal-titles.md
      - "3.6 Italics": editorial/italics.md
      - "3.7 Plurals": editorial/plurals.md
      - "3.8 Numbers": editorial/numbers.md
      - "3.9 Quotation Marks": editorial/quotation-marks.md
      - "3.10 Punctuation": editorial/punctuation.md
      - "3.11 Footnotes": editorial/footnotes.md
      - "3.12 Abbreviations & Acronyms": editorial/abbreviations.md
      - "3.13 Vertical Lists": editorial/lists.md
      - "3.14 Apostrophes & Possessives": editorial/apostrophes.md
      - "3.15 Citations & References": editorial/citations.md
  - Tithis: tithis/index.md
  - Diacritics:
      - "5.1 Diacritics & Transliteration": diacritics/index.md
      - "5.2 SAP Diacritics Policy": diacritics/sap-policy.md
      - "5.3 Macron-Only Convention": diacritics/macron-convention.md
      - "5.4 Glossary Reference": diacritics/glossary-reference.md
  - InDesign:
      - "6.1 InDesign": indesign/index.md
      - "6.2 Paragraph Styles": indesign/paragraph-styles.md
      - "6.3 Character Styles": indesign/character-styles.md
      - "6.4 Object Styles": indesign/object-styles.md
      - "6.5 Master Pages": indesign/master-pages.md
  - EPUB:
      - "7.1 EPUB Accessibility": epub/index.md
      - "7.2 Alt Text Guidelines": epub/alt-text.md
      - "7.3 Reading Order": epub/reading-order.md
  - Scripts:
      - "8.1 Scripts & Tools": scripts/index.md
      - "8.2 JSX Scripts Reference": scripts/jsx-reference.md
  - Workflows:
      - "9.1 Workflows": workflows/index.md
      - "9.2 File Versioning Rules": workflows/versioning.md
      - "9.3 File Naming": workflows/file-naming.md
  - Discussions:
      - "10.1 Open Discussions": discussions/index.md
      - "10.2 Sanstha & Mandirs": discussions/sanstha-and-mandirs.md
      - "10.3 Gurus & Honorifics": discussions/gurus-and-honorifics.md
      - "10.4 Shastras": discussions/shastras.md
      - "10.5 Indic Words": discussions/indic-words.md
      - "10.6 Transliteration": discussions/transliteration.md
      - "10.7 Base Style Manual": discussions/base-style-manual.md
  - Pitfalls: pitfalls/index.md
  - Downloads: downloads/index.md
  - Feedback: feedback.md
  - Changelog: changelog.md

# ---------------------------------------------------------------
# Extra
# ---------------------------------------------------------------
extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/dtpenglish
  version:
    provider: mike
    default: latest

copyright: >
  Copyright © BAPS Swaminarayan Sanstha — DTP Team.
  Internal style guide for production use.

# ---------------------------------------------------------------
# Custom CSS / JS — adds horizontal scroll arrows to the top tab
# bar when its content overflows the viewport.
# ---------------------------------------------------------------
extra_css:
  - assets/stylesheets/extra.css

extra_javascript:
  - assets/javascripts/extra.js
